# Guarda este archivo en per26-final-opentargets como:
#   .github/workflows/tests.yml
#
# Sustituye a .gitlab-ci.yml, que en GitHub no hace absolutamente nada.
# A partir del primer push te sale una marca verde junto a cada commit y puedes
# poner la insignia en el README. Para un repositorio de estudiante, ver
# "42 tests passing" en verde vale más que tres párrafos explicando que hay tests.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # requests solo hace falta para que data1.py se importe sin error;
      # las pruebas no llaman a la API real.
      - name: Instalar dependencias
        run: pip install requests

      - name: Lanzar la batería de pruebas
        run: python -m unittest unittests.py -v

# Después, añade esta línea al principio del README (bajo el título):
