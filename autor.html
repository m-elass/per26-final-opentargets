<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Autor · Open Targets Explorer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0c29 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            color: #e0e0e0;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(1px 1px at 60% 70%, white, transparent),
                radial-gradient(2px 2px at 80% 10%, white, transparent),
                radial-gradient(1px 1px at 33% 80%, #d8a0ff, transparent);
            background-size: 200% 200%;
            opacity: 0.4;
            pointer-events: none;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 16px;
            border: 1px solid rgba(177,74,255,0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s ease;
        }
        .avatar {
            width: 100px; height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a90ff, #b14aff, #ff4a4a);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5em;
            color: white;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(177,74,255,0.5);
        }
        h1 {
            background: linear-gradient(90deg, #4a90ff, #b14aff, #ff4a4a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8em;
            margin-bottom: 8px;
        }
        .subtitle { color: #888aa0; margin-bottom: 30px; }
        .info-row {
            background: rgba(0,0,0,0.3);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #b14aff;
            text-align: left;
        }
        .info-row strong {
            color: #b14aff;
            display: block;
            font-size: 0.85em;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .info-row a {
            color: #e0e0e0;
            text-decoration: none;
            word-break: break-all;
        }
        .info-row a:hover { color: #b14aff; text-decoration: underline; }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #4a90ff, #b14aff);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(177,74,255,0.4);
        }
        @keyframes fadeUp { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">M</div>
        <h1>Mohamed Elassouti</h1>
        <p class="subtitle">Práctica final · Open Targets Explorer</p>
        <div class="info-row">
            <strong>Repositorio GitLab</strong>
            <a href="https://gitlab.eif.urjc.es/melass" target="_blank">https://gitlab.eif.urjc.es/melass</a>
        </div>
        <div class="info-row">
            <strong>Asignatura</strong>
            <a>Programación en Entornos de Red (PER)</a>
        </div>
        <a href="/" class="back-btn">← Volver al buscador</a>
    </div>
</body>
</html>
