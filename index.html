<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Open Targets · Cursed Energies Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0c29 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #e0e0e0;
            overflow-x: hidden;
            position: relative;
        }

        /* Estrellas de fondo */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(1px 1px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(2px 2px at 80% 10%, white, transparent),
                radial-gradient(1px 1px at 90% 60%, white, transparent),
                radial-gradient(2px 2px at 33% 80%, white, transparent),
                radial-gradient(1px 1px at 15% 85%, #d8a0ff, transparent),
                radial-gradient(1px 1px at 75% 25%, #aaccff, transparent);
            background-size: 200% 200%;
            opacity: 0.4;
            animation: twinkle 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes twinkle { 0%,100% {opacity:0.2;} 50% {opacity:0.5;} }

        .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

        header { text-align: center; margin-bottom: 40px; animation: fadeDown 0.8s ease; }

        header h1 {
            font-size: 3em; font-weight: 900;
            background: linear-gradient(90deg, #4a90ff, #b14aff, #ff4a4a);
            background-size: 200% 200%;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 4s ease infinite;
            text-shadow: 0 0 40px rgba(177, 74, 255, 0.5);
        }
        @keyframes gradient { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }

        header p { font-size: 1.1em; color: #a0a0c0; margin-top: 10px; }

        /* Selector de efecto */
        .effect-selector {
            display: inline-flex; margin-top: 24px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(177,74,255,0.3);
            border-radius: 50px; padding: 4px;
            backdrop-filter: blur(10px); gap: 4px;
        }
        .effect-option {
            padding: 10px 22px; border-radius: 50px; cursor: pointer;
            font-size: 0.85em; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; color: #888aa0;
            background: transparent; border: none;
            transition: all 0.3s ease;
        }
        .effect-option:hover { color: #b14aff; }
        .effect-option.active[data-effect="hollow"] {
            background: linear-gradient(135deg, #4a90ff, #b14aff, #ff4a4a);
            color: white; box-shadow: 0 0 20px rgba(177,74,255,0.6);
        }
        .effect-option.active[data-effect="void"] {
            background: linear-gradient(135deg, #1a0033, #6600cc, #000);
            color: white; box-shadow: 0 0 20px rgba(102,0,204,0.7);
        }
        .effect-option.active[data-effect="off"] {
            background: rgba(102,102,102,0.4); color: white;
        }

        /* Tabs */
        .tabs {
            display: flex; background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px 12px 0 0; overflow: hidden;
            border: 1px solid rgba(177,74,255,0.2); border-bottom: none;
        }
        .tab {
            flex: 1; padding: 16px; cursor: pointer;
            font-weight: 600; color: #888aa0; background: transparent;
            border: none; font-size: 0.9em; transition: all 0.3s ease;
        }
        .tab:hover { color: #b14aff; background: rgba(177,74,255,0.1); }
        .tab.active {
            color: white;
            background: linear-gradient(135deg, #4a90ff, #b14aff);
            box-shadow: 0 0 20px rgba(177,74,255,0.5);
        }

        .card {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 0 0 12px 12px;
            border: 1px solid rgba(177,74,255,0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: fadeUp 0.5s ease;
        }

        .form-panel { display: none; }
        .form-panel.active { display: block; animation: fadeIn 0.4s ease; }

        .form-group { margin-bottom: 20px; }
        label {
            display: block; margin-bottom: 8px; font-weight: 600;
            color: #b14aff; font-size: 0.85em;
            text-transform: uppercase; letter-spacing: 1px;
        }
        input[type="text"], select {
            width: 100%; padding: 14px 16px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(177,74,255,0.3);
            border-radius: 8px; color: #e0e0e0;
            font-size: 1em; transition: all 0.3s ease;
        }
        input[type="text"]:focus, select:focus {
            outline: none; border-color: #b14aff;
            background: rgba(0,0,0,0.5);
            box-shadow: 0 0 0 3px rgba(177,74,255,0.2), 0 0 20px rgba(177,74,255,0.4);
        }
        input::placeholder { color: #666; }
        .btn {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, #4a90ff, #b14aff, #ff4a4a);
            background-size: 200% 200%;
            color: white; border: none; border-radius: 8px;
            font-size: 1.05em; font-weight: 700; cursor: pointer;
            margin-top: 10px; transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .btn:hover {
            background-position: 100% 0; transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(177,74,255,0.6), 0 0 40px rgba(74,144,255,0.4);
        }
        .info-badge {
            display: inline-block; background: rgba(177,74,255,0.2);
            color: #b14aff; padding: 4px 10px; border-radius: 12px;
            font-size: 0.75em; margin-left: 8px;
        }
        .examples {
            background: rgba(74,144,255,0.1);
            padding: 10px 14px; border-radius: 6px;
            font-size: 0.85em; color: #8fa8d0;
            margin-top: 6px; border-left: 3px solid #4a90ff;
        }
        .author-link {
            display: block; margin-top: 30px; text-align: center;
            color: #b14aff; text-decoration: none; font-weight: 600;
            transition: text-shadow 0.3s ease;
        }
        .author-link:hover { text-shadow: 0 0 15px rgba(177,74,255,0.8); }

        /* HOLLOW PURPLE OVERLAY */
        .hollow-overlay, .void-overlay {
            position: fixed; inset: 0; z-index: 9999;
            pointer-events: none; display: none;
        }
        .hollow-overlay {
            background: rgba(0,0,0,0); transition: background 0.3s ease;
            align-items: center; justify-content: center;
        }
        .hollow-overlay.active { display: flex; background: rgba(0,0,0,0.7); }
        .stage {
            position: relative; width: 600px; height: 600px;
            display: flex; align-items: center; justify-content: center;
        }
        .orb {
            position: absolute; width: 120px; height: 120px;
            border-radius: 50%; top: 50%;
            transform: translate(-50%, -50%);
        }
        .orb-blue {
            background: radial-gradient(circle at 30% 30%, #aaccff, #4a90ff 40%, #0044aa);
            box-shadow: 0 0 60px #4a90ff, 0 0 120px #4a90ff, inset 0 0 30px #aaccff;
            left: 20%; opacity: 0;
        }
        .orb-red {
            background: radial-gradient(circle at 30% 30%, #ffaaaa, #ff4a4a 40%, #aa0000);
            box-shadow: 0 0 60px #ff4a4a, 0 0 120px #ff4a4a, inset 0 0 30px #ffaaaa;
            left: 80%; opacity: 0;
        }
        .hollow-overlay.active .orb-blue { animation: blueAppear 2.5s ease forwards; }
        .hollow-overlay.active .orb-red  { animation: redAppear  2.5s ease forwards; }
        @keyframes blueAppear {
            0% {opacity:0; transform:translate(-50%,-50%) scale(0);}
            20%{opacity:1; transform:translate(-50%,-50%) scale(1);}
            70%{opacity:1; transform:translate(-50%,-50%) scale(1.1); left:20%;}
            100%{opacity:0.9; transform:translate(-50%,-50%) scale(1.3); left:50%;}
        }
        @keyframes redAppear {
            0% {opacity:0; transform:translate(-50%,-50%) scale(0);}
            20%{opacity:1; transform:translate(-50%,-50%) scale(1);}
            70%{opacity:1; transform:translate(-50%,-50%) scale(1.1); left:80%;}
            100%{opacity:0.9; transform:translate(-50%,-50%) scale(1.3); left:50%;}
        }
        .purple-core {
            position: absolute; width: 100px; height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #d8a0ff 20%, #b14aff 50%, #6600cc 100%);
            box-shadow: 0 0 80px #b14aff, 0 0 160px #b14aff, 0 0 240px #6600cc, inset 0 0 40px #ffffff;
            opacity: 0;
        }
        .hollow-overlay.active .purple-core { animation: purpleBirth 2.5s ease forwards; }
        @keyframes purpleBirth {
            0%,70% {opacity:0; transform:scale(0);}
            75% {opacity:1; transform:scale(0.5);}
            85% {opacity:1; transform:scale(2.5); filter:brightness(2);}
            100%{opacity:1; transform:scale(4);   filter:brightness(1.5);}
        }
        .shockwave {
            position: absolute; width: 100px; height: 100px;
            border-radius: 50%; border: 4px solid #b14aff; opacity: 0;
        }
        .hollow-overlay.active .shockwave { animation: shockwave 2.5s ease forwards; }
        .hollow-overlay.active .shockwave:nth-child(5) { animation-delay: 0.1s; border-color: #ff4a4a; }
        .hollow-overlay.active .shockwave:nth-child(6) { animation-delay: 0.2s; border-color: #4a90ff; }
        @keyframes shockwave {
            0%,75% {opacity:0; transform:scale(1);}
            80% {opacity:1; transform:scale(1); border-width:6px;}
            100%{opacity:0; transform:scale(15); border-width:1px;}
        }
        .hollow-text {
            position: absolute; bottom: 15%;
            font-size: 2.5em; font-weight: 900;
            color: white; letter-spacing: 8px; text-transform: uppercase;
            text-shadow: 0 0 20px #b14aff, 0 0 40px #b14aff, 0 0 60px #ff4a4a;
            opacity: 0;
        }
        .hollow-overlay.active .hollow-text { animation: textPop 2.5s ease forwards; }
        @keyframes textPop {
            0%,80% {opacity:0; transform:scale(0.5);}
            90% {opacity:1; transform:scale(1.1);}
            100%{opacity:1; transform:scale(1);}
        }
        .particle {
            position: absolute; width: 8px; height: 8px;
            border-radius: 50%; background: white;
            box-shadow: 0 0 10px #b14aff, 0 0 20px #b14aff; opacity: 0;
        }
        .hollow-overlay.active .particle { animation: particleOrbit 2.5s ease forwards; }
        @keyframes particleOrbit {
            0%,70% {opacity:0; transform:translate(0,0);}
            80% {opacity:1;}
            100%{opacity:0; transform:translate(var(--dx), var(--dy));}
        }

        /* VOID RIFT */
        .void-overlay.active {
            display: block;
            background: radial-gradient(circle at center,
                rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 30%,
                rgba(10,0,30,0.85) 60%, rgba(0,0,0,0.98) 100%);
            transition: background 0.6s ease;
        }
        .void-flash {
            position: fixed; inset: 0; background: white;
            opacity: 0; pointer-events: none; mix-blend-mode: overlay;
        }
        .void-overlay.active .void-flash { animation: voidFlash 2.8s ease forwards; }
        @keyframes voidFlash {
            0%{opacity:0;} 3%{opacity:1;} 8%{opacity:0.4;}
            12%{opacity:0.8;} 18%{opacity:0;} 100%{opacity:0;}
        }
        .void-chromatic {
            position: fixed; inset: 0; pointer-events: none; opacity: 0;
            background: radial-gradient(circle at center,
                transparent 40%, rgba(177,74,255,0.15) 50%,
                rgba(74,0,130,0.3) 60%, transparent 70%);
            mix-blend-mode: screen;
        }
        .void-overlay.active .void-chromatic { animation: chromaticPulse 2.8s ease forwards; }
        @keyframes chromaticPulse {
            0%,15% {opacity:0; transform:scale(0.5);}
            25% {opacity:1; transform:scale(1.5);}
            70% {opacity:0.6; transform:scale(3);}
            100% {opacity:0; transform:scale(5);}
        }
        .glass-fragment {
            position: fixed; inset: 0;
            background: linear-gradient(135deg,
                rgba(40,40,70,0.95) 0%, rgba(22,33,62,0.95) 50%, rgba(15,12,41,0.95) 100%);
            box-shadow:
                inset 0 0 25px rgba(177,74,255,0.25),
                inset 2px 2px 0 rgba(255,255,255,0.15),
                0 0 1px rgba(255,255,255,0.9);
            opacity: 0; transform-origin: center;
            backdrop-filter: blur(0.5px);
            filter: drop-shadow(0 0 3px rgba(177,74,255,0.7));
        }
        .void-overlay.active .glass-fragment {
            animation: fragmentBreak 2.8s cubic-bezier(0.6,0,0.85,0.2) forwards;
        }
        @keyframes fragmentBreak {
            0%,8%  {opacity:0; transform:translate(0,0) rotate(0) scale(1); filter:brightness(1);}
            14%    {opacity:1; transform:translate(0,0) rotate(0) scale(1); filter:brightness(1.5);}
            22%    {opacity:1; transform:translate(var(--fx,0),var(--fy,0)) rotate(var(--fr,0deg)) scale(0.97); filter:brightness(1.3);}
            55%    {opacity:1; transform:translate(calc(var(--tx,0px)*0.4),calc(var(--ty,0px)*0.4)) rotate(calc(var(--tr,0deg)*1.5)) scale(0.7); filter:brightness(0.8);}
            80%    {opacity:0.7; transform:translate(calc(var(--tx,0px)*0.85),calc(var(--ty,0px)*0.85)) rotate(calc(var(--tr,0deg)*3)) scale(0.25); filter:brightness(0.4);}
            100%   {opacity:0; transform:translate(var(--tx,0px),var(--ty,0px)) rotate(calc(var(--tr,0deg)*5)) scale(0); filter:brightness(0);}
        }
        .void-lensing {
            position: fixed; top: 50%; left: 50%;
            width: 400px; height: 400px; border-radius: 50%;
            background: radial-gradient(circle,
                transparent 30%, rgba(177,74,255,0.05) 35%,
                rgba(102,0,204,0.15) 45%, rgba(177,74,255,0.08) 55%, transparent 65%);
            opacity: 0; transform: translate(-50%,-50%) scale(0);
            mix-blend-mode: screen; filter: blur(8px);
        }
        .void-overlay.active .void-lensing { animation: lensingGrow 2.8s ease forwards; }
        @keyframes lensingGrow {
            0%,20% {opacity:0; transform:translate(-50%,-50%) scale(0);}
            35% {opacity:1; transform:translate(-50%,-50%) scale(1);}
            65% {opacity:0.9; transform:translate(-50%,-50%) scale(2.5);}
            100%{opacity:0; transform:translate(-50%,-50%) scale(6);}
        }
        .void-glow {
            position: fixed; top: 50%; left: 50%;
            width: 300px; height: 300px; border-radius: 50%;
            background: radial-gradient(circle,
                rgba(255,200,255,0.4) 0%, rgba(177,74,255,0.6) 20%,
                rgba(102,0,204,0.5) 40%, rgba(40,0,80,0.3) 60%, transparent 80%);
            opacity: 0; transform: translate(-50%,-50%) scale(0);
            filter: blur(20px); mix-blend-mode: screen;
        }
        .void-overlay.active .void-glow { animation: glowPulse 2.8s ease forwards; }
        @keyframes glowPulse {
            0%,22% {opacity:0; transform:translate(-50%,-50%) scale(0);}
            38% {opacity:1; transform:translate(-50%,-50%) scale(1); filter:blur(20px);}
            65% {opacity:1; transform:translate(-50%,-50%) scale(2.2); filter:blur(30px);}
            100%{opacity:0.9; transform:translate(-50%,-50%) scale(8); filter:blur(60px);}
        }
        .void-disk-1 {
            position: fixed; top: 50%; left: 50%;
            width: 220px; height: 220px; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0%,
                rgba(255,220,255,0.9) 8%, rgba(177,74,255,1) 18%,
                rgba(102,0,204,0.6) 30%, transparent 45%, transparent 55%,
                rgba(255,220,255,0.9) 65%, rgba(177,74,255,1) 75%,
                rgba(102,0,204,0.6) 85%, transparent 100%);
            mask: radial-gradient(circle, transparent 35%, black 42%, black 50%, transparent 60%);
            -webkit-mask: radial-gradient(circle, transparent 35%, black 42%, black 50%, transparent 60%);
            opacity: 0; transform: translate(-50%,-50%) scale(0);
            filter: blur(2px) brightness(1.5);
        }
        .void-overlay.active .void-disk-1 { animation: diskSpin1 2.8s linear forwards; }
        @keyframes diskSpin1 {
            0%,22% {opacity:0; transform:translate(-50%,-50%) scale(0) rotate(0deg);}
            38% {opacity:1; transform:translate(-50%,-50%) scale(1) rotate(180deg);}
            65% {opacity:1; transform:translate(-50%,-50%) scale(2) rotate(720deg);}
            100%{opacity:0.7; transform:translate(-50%,-50%) scale(5) rotate(1440deg);}
        }
        .void-disk-2 {
            position: fixed; top: 50%; left: 50%;
            width: 160px; height: 160px; border-radius: 50%;
            background: conic-gradient(from 90deg, transparent 0%,
                rgba(255,255,255,1) 12%, rgba(216,160,255,0.9) 25%, transparent 40%,
                rgba(255,255,255,1) 60%, rgba(216,160,255,0.9) 75%, transparent 100%);
            mask: radial-gradient(circle, transparent 30%, black 38%, black 48%, transparent 58%);
            -webkit-mask: radial-gradient(circle, transparent 30%, black 38%, black 48%, transparent 58%);
            opacity: 0; transform: translate(-50%,-50%) scale(0);
            filter: blur(1px) brightness(1.8);
        }
        .void-overlay.active .void-disk-2 { animation: diskSpin2 2.8s linear forwards; }
        @keyframes diskSpin2 {
            0%,25% {opacity:0; transform:translate(-50%,-50%) scale(0) rotate(0deg);}
            40% {opacity:1; transform:translate(-50%,-50%) scale(1) rotate(-360deg);}
            65% {opacity:1; transform:translate(-50%,-50%) scale(1.8) rotate(-1080deg);}
            100%{opacity:0.6; transform:translate(-50%,-50%) scale(4.5) rotate(-2160deg);}
        }
        .void-rift {
            position: fixed; top: 50%; left: 50%;
            width: 100px; height: 100px; border-radius: 50%;
            background: radial-gradient(circle at 50% 50%,
                #000 0%, #000 55%, rgba(20,0,40,1) 70%,
                rgba(60,0,100,0.9) 82%, rgba(140,50,200,0.6) 92%, transparent 100%);
            box-shadow:
                inset 0 0 30px rgba(0,0,0,1),
                inset 0 0 60px rgba(40,0,80,0.8),
                0 0 80px rgba(102,0,204,0.4),
                0 0 160px rgba(177,74,255,0.3);
            opacity: 0; transform: translate(-50%,-50%) scale(0);
        }
        .void-overlay.active .void-rift { animation: riftGrow 2.8s ease forwards; }
        @keyframes riftGrow {
            0%,22% {opacity:0; transform:translate(-50%,-50%) scale(0);}
            35% {opacity:1; transform:translate(-50%,-50%) scale(0.6);}
            55% {opacity:1; transform:translate(-50%,-50%) scale(1.5);}
            75% {opacity:1; transform:translate(-50%,-50%) scale(4);}
            100%{opacity:1; transform:translate(-50%,-50%) scale(60);}
        }
        .void-singularity {
            position: fixed; top: 50%; left: 50%;
            width: 8px; height: 8px; border-radius: 50%;
            background: white;
            box-shadow: 0 0 20px white, 0 0 40px #d8a0ff, 0 0 80px #b14aff;
            opacity: 0; transform: translate(-50%,-50%) scale(0);
        }
        .void-overlay.active .void-singularity { animation: singularityFlash 2.8s ease forwards; }
        @keyframes singularityFlash {
            0%,32% {opacity:0; transform:translate(-50%,-50%) scale(0);}
            38% {opacity:1; transform:translate(-50%,-50%) scale(3);}
            48% {opacity:1; transform:translate(-50%,-50%) scale(1);}
            70% {opacity:0.8; transform:translate(-50%,-50%) scale(0.5);}
            100%{opacity:0; transform:translate(-50%,-50%) scale(0);}
        }
        .void-spark {
            position: fixed; width: 5px; height: 5px;
            border-radius: 50%; background: white;
            box-shadow: 0 0 6px white, 0 0 12px #d8a0ff, 0 0 24px #b14aff;
            opacity: 0; top: 0; left: 0;
        }
        .void-overlay.active .void-spark { animation: sparkSpiral 2.8s cubic-bezier(0.4,0,1,0.6) forwards; }
        @keyframes sparkSpiral {
            0%,25%  {opacity:0; transform:translate(var(--start-x),var(--start-y)) scale(1);}
            35%     {opacity:1; transform:translate(var(--start-x),var(--start-y)) scale(1);}
            70%     {opacity:1; transform:translate(var(--mid-x),var(--mid-y)) scale(0.7);}
            95%     {opacity:1; transform:translate(50vw,50vh) scale(0.2);}
            100%    {opacity:0; transform:translate(50vw,50vh) scale(0);}
        }
        .void-streak {
            position: fixed; width: 2px;
            background: linear-gradient(to bottom,
                transparent, rgba(255,255,255,0.6),
                rgba(177,74,255,0.9), transparent);
            transform-origin: top center;
            opacity: 0; top: 0; left: 0;
            filter: blur(0.5px);
        }
        .void-overlay.active .void-streak { animation: streakSuck 2.8s ease forwards; }
        @keyframes streakSuck {
            0%,30% {opacity:0; height:0;}
            45% {opacity:1; height:30px;}
            75% {opacity:1; height:200px;}
            100%{opacity:0; height:600px;}
        }

        @keyframes fadeIn   { from{opacity:0;} to{opacity:1;} }
        @keyframes fadeUp   { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
        @keyframes fadeDown { from{opacity:0; transform:translateY(-20px);} to{opacity:1; transform:translateY(0);} }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧬 Open Targets Explorer</h1>
            <p>Domain of Therapeutic Targets</p>
            <div class="effect-selector">
                <button class="effect-option active" data-effect="hollow" onclick="setEffect('hollow')">⚡ Hollow Purple</button>
                <button class="effect-option" data-effect="void" onclick="setEffect('void')">🌌 Void Rift</button>
                <button class="effect-option" data-effect="off" onclick="setEffect('off')">⏸ Sin efecto</button>
            </div>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="showTab(0)">Búsqueda general</button>
            <button class="tab" onclick="showTab(1)">Por Target</button>
            <button class="tab" onclick="showTab(2)">Por Disease</button>
            <button class="tab" onclick="showTab(3)">POST</button>
        </div>

        <div class="card">
            <!-- BÚSQUEDA GENERAL (GET) -->
            <div class="form-panel active">
                <form action="/resultados" method="get" class="hollow-form">
                    <div class="form-group">
                        <label>Origen de datos</label>
                        <select name="source">
                            <option value="api">🌐 API Open Targets</option>
                            <option value="local">📁 Datos locales (JSON)</option>

    <!-- Hollow Purple Overlay -->
    <div class="hollow-overlay" id="hollowOverlay">
        <div class="stage">
            <div class="orb orb-blue"></div>
            <div class="orb orb-red"></div>
            <div class="purple-core"></div>
            <div class="shockwave"></div>
            <div class="shockwave"></div>
            <div class="shockwave"></div>
            <div class="hollow-text">HOLLOW PURPLE</div>
        </div>
    </div>

    <!-- Void Rift Overlay -->
    <div class="void-overlay" id="voidOverlay">
        <div class="void-flash"></div>
        <div class="void-chromatic"></div>
        <div class="void-lensing"></div>
        <div class="void-glow"></div>
        <div class="void-disk-1"></div>
        <div class="void-disk-2"></div>
        <div class="void-rift"></div>
        <div class="void-singularity"></div>
    </div>

    <script>
        // Tabs
        function showTab(idx) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
            document.querySelectorAll('.form-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
        }

        // Cookies (persistencia simple, sin localStorage)
        function setCookie(name, value, days) {
            const d = new Date();
            d.setTime(d.getTime() + days*24*60*60*1000);
            document.cookie = name + "=" + value + ";expires=" + d.toUTCString() + ";path=/";
        }
        function getCookie(name) {
            const m = document.cookie.match(new RegExp('(^|;)\\s*' + name + '=([^;]+)'));
            return m ? m[2] : null;
        }

        // Selector de efecto
        let currentEffect = getCookie('effectMode') || 'hollow';
        applyEffectButton(currentEffect);
        function setEffect(effect) {
            currentEffect = effect;
            setCookie('effectMode', effect, 30);
            applyEffectButton(effect);
        }
        function applyEffectButton(effect) {
            document.querySelectorAll('.effect-option').forEach(b => {
                b.classList.toggle('active', b.dataset.effect === effect);
            });
        }

        // Hollow Purple
        function playHollowPurple(form) {
            const overlay = document.getElementById('hollowOverlay');
            const stage = overlay.querySelector('.stage');
            stage.querySelectorAll('.particle').forEach(p => p.remove());
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const angle = (i / 30) * Math.PI * 2;
                const dist = 200 + Math.random() * 300;
                p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                p.style.animationDelay = (Math.random() * 0.3) + 's';
                stage.appendChild(p);
            }
            overlay.classList.add('active');
            setTimeout(() => form.submit(), 2400);
        }

        // Void Rift
        function playVoidRift(form) {
            const overlay = document.getElementById('voidOverlay');
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            overlay.querySelectorAll('.glass-fragment, .void-spark, .void-streak').forEach(el => el.remove());

            const fragments = [
                'polygon(0% 0%, 28% 0%, 22% 22%, 0% 18%)',
                'polygon(28% 0%, 52% 0%, 48% 25%, 22% 22%)',
                'polygon(52% 0%, 76% 0%, 72% 20%, 48% 25%)',
                'polygon(76% 0%, 100% 0%, 100% 22%, 72% 20%)',
                'polygon(0% 18%, 22% 22%, 18% 48%, 0% 45%)',
                'polygon(22% 22%, 48% 25%, 44% 50%, 18% 48%)',
                'polygon(48% 25%, 72% 20%, 70% 50%, 44% 50%)',
                'polygon(72% 20%, 100% 22%, 100% 48%, 70% 50%)',
                'polygon(0% 45%, 18% 48%, 22% 75%, 0% 72%)',
                'polygon(18% 48%, 44% 50%, 48% 78%, 22% 75%)',
                'polygon(44% 50%, 70% 50%, 72% 78%, 48% 78%)',
                'polygon(70% 50%, 100% 48%, 100% 75%, 72% 78%)',
                'polygon(0% 72%, 22% 75%, 25% 100%, 0% 100%)',
                'polygon(22% 75%, 48% 78%, 52% 100%, 25% 100%)',
                'polygon(48% 78%, 72% 78%, 75% 100%, 52% 100%)',
                'polygon(72% 78%, 100% 75%, 100% 100%, 75% 100%)'
            ];
            fragments.forEach((clip, i) => {
                const f = document.createElement('div');
                f.className = 'glass-fragment';
                f.style.clipPath = clip;
                const fx = (Math.random() - 0.5) * 25;
                const fy = (Math.random() - 0.5) * 25;
                const fr = (Math.random() - 0.5) * 12;
                const tx = (cx - window.innerWidth/2) + (Math.random() - 0.5) * 80;
                const ty = (cy - window.innerHeight/2) + (Math.random() - 0.5) * 80;
                const tr = (Math.random() - 0.5) * 900;
                f.style.setProperty('--fx', fx + 'px');
                f.style.setProperty('--fy', fy + 'px');
                f.style.setProperty('--fr', fr + 'deg');
                f.style.setProperty('--tx', tx + 'px');
                f.style.setProperty('--ty', ty + 'px');
                f.style.setProperty('--tr', tr + 'deg');
                f.style.animationDelay = (i * 0.015) + 's';
                overlay.appendChild(f);
            });

            for (let i = 0; i < 80; i++) {
                const s = document.createElement('div');
                s.className = 'void-spark';
                const startAngle = Math.random() * Math.PI * 2;
                const startDist = 200 + Math.random() * 600;
                const sx = cx + Math.cos(startAngle) * startDist;
                const sy = cy + Math.sin(startAngle) * startDist;
                const midAngle = startAngle + Math.PI / 3;
                const midDist = 80 + Math.random() * 60;
                const mx = cx + Math.cos(midAngle) * midDist;
                const my = cy + Math.sin(midAngle) * midDist;
                s.style.setProperty('--start-x', sx + 'px');
                s.style.setProperty('--start-y', sy + 'px');
                s.style.setProperty('--mid-x', mx + 'px');
                s.style.setProperty('--mid-y', my + 'px');
                s.style.animationDelay = (Math.random() * 0.5 + 0.4) + 's';
                const scale = 0.5 + Math.random() * 1.5;
                s.style.width = (5 * scale) + 'px';
                s.style.height = (5 * scale) + 'px';
                overlay.appendChild(s);
            }

            for (let i = 0; i < 24; i++) {
                const k = document.createElement('div');
                k.className = 'void-streak';
                const angle = (i / 24) * 360 + Math.random() * 15;
                const dist = 250 + Math.random() * 300;
                const startX = cx + Math.cos(angle * Math.PI / 180) * dist;
                const startY = cy + Math.sin(angle * Math.PI / 180) * dist;
                k.style.left = startX + 'px';
                k.style.top = startY + 'px';
                const angleToCenter = Math.atan2(cy - startY, cx - startX) * 180 / Math.PI - 90;
                k.style.transform = `rotate(${angleToCenter}deg)`;
                k.style.animationDelay = (Math.random() * 0.4 + 0.3) + 's';
                overlay.appendChild(k);
            }

            overlay.classList.add('active');
            setTimeout(() => form.submit(), 2700);
        }

        // Interceptar formularios
        document.querySelectorAll('.hollow-form').forEach(form => {
            form.addEventListener('submit', function(e) {
                if (currentEffect === 'off') return;
                e.preventDefault();
                if (currentEffect === 'hollow') playHollowPurple(form);
                else if (currentEffect === 'void') playVoidRift(form);
            });
        });
    </script>
</body>
